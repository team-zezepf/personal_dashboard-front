<app-header pageTitle="ツール一覧"></app-header>

<main class="container">
  <div class="card">
    <table class="tool-table">
      <thead>
        <tr>
          <th>ツール名</th>
          <th>利用可能ロール</th>
          <th class="col-fav">お気に入り</th>
        </tr>
      </thead>

      <tbody>
        @for (tool of tools; track tool.path) {
          <tr>
            <td>
              <a [routerLink]="tool.path" class="tool-link">
                {{ tool.name }}
              </a>
            </td>
            <td>
              <div class="role-badges">
                @for (role of allRoles; track role) {
                  <span
                    class="role-badge"
                    [class]="isAllowed(tool, role) ? roleBadgeClass(role) : 'role-disabled'"
                  >{{ roleLabel(role) }}</span>
                }
              </div>
            </td>
            <td class="col-fav">
              <button
                class="fav-btn"
                type="button"
                [class.is-favorite]="isFavorite(tool)"
                [disabled]="isPending(tool)"
                [attr.aria-label]="(isFavorite(tool) ? tool.name + 'のお気に入りを解除' : tool.name + 'をお気に入りに追加')"
                (click)="toggleFavorite(tool)"
              >{{ isFavorite(tool) ? '★' : '☆' }}</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  <footer>
    © 2026 MY DASHBOARD
  </footer>
</main>
