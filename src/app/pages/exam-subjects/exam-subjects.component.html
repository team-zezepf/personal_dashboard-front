<app-header pageTitle="資格学習"></app-header>

<main class="page">
  <h1 class="page-title">資格学習</h1>
  <p class="page-desc">学習する科目を選んでください。</p>

  <div class="subject-list">
    @for (subject of subjects; track subject.key) {
      <div class="subject-card">
        <div class="subject-info">
          <span class="subject-name">{{ subject.name }}</span>
          <span class="subject-desc">{{ subject.description }}</span>
          <span class="subject-mock-desc">
            模擬試験: {{ subject.mockExam.durationMinutes }}分・{{ subject.mockExam.questionCount }}問・合格ボーダー{{ subject.mockExam.passRatio * 100 }}%
          </span>
        </div>
        <div class="subject-actions">
          @if (hasGenres(subject.key)) {
            <a class="btn btn-ghost" [routerLink]="[subject.path, 'genres']">学習する</a>
          }
          <a class="btn btn-ghost" [routerLink]="subject.path">練習する</a>
          <a class="btn btn-primary" [routerLink]="[subject.path, 'mock-exam']">模擬試験を受ける</a>
        </div>
      </div>
    }
  </div>
</main>
