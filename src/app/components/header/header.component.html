<header class="topbar">
  <div class="title-menu-wrapper">
    <button
      class="page-title-button"
      type="button"
      (click)="toggleTitleMenu()"
      [attr.aria-expanded]="isTitleMenuOpen()"
      aria-haspopup="true"
    >
      <span class="page-title-text">{{ pageTitle }}</span>
    </button>

    @if (isTitleMenuOpen()) {
      <div class="title-menu" role="menu">
        <a
          class="title-menu-item"
          role="menuitem"
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeTitleMenu()"
        >Dashboard</a>
        <a class="title-menu-item" role="menuitem" routerLink="/users" routerLinkActive="active" (click)="closeTitleMenu()">ユーザー管理</a>
        <a class="title-menu-item" role="menuitem" routerLink="/tools" routerLinkActive="active" (click)="closeTitleMenu()">ツール一覧</a>
      </div>
    }
  </div>

  <div class="date">{{ formattedDate() }}</div>

  <div class="avatar-menu-wrapper">
    <button
      class="avatar-button"
      type="button"
      (click)="toggleAvatarMenu()"
      [attr.aria-expanded]="isAvatarMenuOpen()"
      aria-haspopup="true"
      aria-label="ユーザーメニュー"
    >
      <img class="user-avatar" [src]="avatarSrc()" alt="ユーザーアイコン">
    </button>

    @if (isAvatarMenuOpen()) {
      <div class="avatar-menu" role="menu">
        <a class="avatar-menu-item" role="menuitem" routerLink="/tools" (click)="closeAvatarMenu()">ツール一覧</a>
        <a class="avatar-menu-item" role="menuitem" routerLink="/account" (click)="closeAvatarMenu()">アカウント情報編集</a>
        <button class="avatar-menu-item" role="menuitem" type="button" (click)="onLogout()">ログアウト</button>
      </div>
    }
  </div>
</header>
