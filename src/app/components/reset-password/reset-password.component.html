<main class="login-page">
  <section class="login-card">

    <div class="brand">
      <h1 class="brand-name">MY DASHBOARD</h1>
      <p class="brand-subtitle">新しいパスワードの設定</p>
    </div>

    @if (!hasToken) {
      <div class="form-error">
        無効なリンクです。パスワード再設定を最初からやり直してください。
      </div>
      <button class="login-button" type="button" (click)="goToForgotPassword()">
        パスワード再設定をやり直す
      </button>
    } @else if (successMessage()) {
      <div class="form-success">{{ successMessage() }}</div>
      <button class="login-button" type="button" (click)="goToLogin()">
        ログイン画面へ
      </button>
    } @else {
      <form (ngSubmit)="onSubmit()">

        @if (errorMessage()) {
          <div class="form-error">{{ errorMessage() }}</div>
        }

        <div class="form-group">
          <label class="form-label" for="newPassword">
            新しいパスワード
          </label>
          <input
            class="form-input"
            type="password"
            id="newPassword"
            name="newPassword"
            [(ngModel)]="newPassword"
            placeholder="新しいパスワードを入力"
            autocomplete="new-password"
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="newPasswordConfirm">
            新しいパスワード（確認）
          </label>
          <input
            class="form-input"
            type="password"
            id="newPasswordConfirm"
            name="newPasswordConfirm"
            [(ngModel)]="newPasswordConfirm"
            placeholder="新しいパスワードを再入力"
            autocomplete="new-password"
            required
          >
        </div>

        <button
          class="login-button"
          type="submit"
          [disabled]="isSubmitting()"
        >
          {{ isSubmitting() ? '再設定中...' : 'パスワードを再設定する' }}
        </button>
      </form>
    }

    <div class="footer">
      © 2026 MY DASHBOARD
    </div>

  </section>
</main>
