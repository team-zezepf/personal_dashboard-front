<main class="login-page">
  <section class="login-card">

    <div class="brand">
      <h1 class="brand-name">MY DASHBOARD</h1>
      <p class="brand-subtitle">パスワードの再設定</p>
    </div>

    @if (successMessage()) {
      <div class="form-success">{{ successMessage() }}</div>
      <button class="login-button" type="button" (click)="goToLogin()">
        ログイン画面に戻る
      </button>
    } @else {
      <p class="description">
        登録済みのメールアドレスを入力してください。パスワード再設定用のリンクを送信します。
      </p>

      <form (ngSubmit)="onSubmit()">

        @if (errorMessage()) {
          <div class="form-error">{{ errorMessage() }}</div>
        }

        <div class="form-group">
          <label class="form-label" for="email">
            メールアドレス
          </label>
          <input
            class="form-input"
            type="email"
            id="email"
            name="email"
            [(ngModel)]="email"
            placeholder="example@example.com"
            autocomplete="email"
            required
          >
        </div>

        <button
          class="login-button"
          type="submit"
          [disabled]="isSubmitting()"
        >
          {{ isSubmitting() ? '送信中...' : 'リセットリンクを送信' }}
        </button>

        <button
          class="register-button"
          type="button"
          (click)="goToLogin()"
        >
          ログイン画面に戻る
        </button>

      </form>
    }

    <div class="footer">
      © 2026 MY DASHBOARD
    </div>

  </section>
</main>
