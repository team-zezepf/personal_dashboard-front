<main class="register-page">
  <section class="register-card">

    <div class="brand">
      <h1 class="brand-name">MY DASHBOARD</h1>
      <p class="brand-subtitle">アカウントを新規登録</p>
    </div>

    <form (ngSubmit)="onSubmit()">

      @if (errorMessage()) {
        <div class="form-error">{{ errorMessage() }}</div>
      }

      <div class="form-group">
        <label class="form-label" for="email">
          メールアドレス
        </label>
        <input
          class="form-input"
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          placeholder="example@example.com"
          autocomplete="email"
          required
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="username">
          ユーザー名
        </label>
        <input
          class="form-input"
          type="text"
          id="username"
          name="username"
          [(ngModel)]="username"
          placeholder="ユーザー名を入力"
          autocomplete="username"
          required
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="avatar">
          プロフィール画像（任意）
        </label>
        <input
          class="form-input file-input"
          type="file"
          id="avatar"
          name="avatar"
          accept="image/png,image/jpeg,image/webp,image/gif"
          (change)="onAvatarSelected($event)"
        >
        @if (avatarPreviewUrl(); as previewUrl) {
          <img class="avatar-preview" [src]="previewUrl" alt="選択した画像のプレビュー">
        }
      </div>

      <div class="form-group">
        <label class="form-label" for="password">
          パスワード
        </label>
        <input
          class="form-input"
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          placeholder="パスワードを入力"
          autocomplete="new-password"
          required
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="password-confirm">
          パスワード（確認）
        </label>
        <input
          class="form-input"
          type="password"
          id="password-confirm"
          name="passwordConfirm"
          [(ngModel)]="passwordConfirm"
          placeholder="パスワードを再入力"
          autocomplete="new-password"
          required
        >
      </div>

      <button
        class="register-button"
        type="submit"
        [disabled]="isSubmitting()"
      >
        {{ isSubmitting() ? '登録中...' : 'アカウントを登録' }}
      </button>

      <button
        class="back-button"
        type="button"
        (click)="goToLogin()"
      >
        ログイン画面に戻る
      </button>

    </form>

    <div class="footer">
      © 2026 MY DASHBOARD
    </div>

  </section>
</main>
