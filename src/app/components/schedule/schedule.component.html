<article class="card">
  <div class="card-header">
    <div>
      <h2 class="card-title">現在の予定</h2>
    </div>
  </div>
  <div class="content">
    <div class="schedule" [style.grid-template-rows]="'repeat(' + totalSubRows + ', ' + subRowHeightPx + 'px)'">
      @for (row of timelineHours(); track row.rowStart) {
        <div class="time" [style.grid-row]="row.rowStart + ' / span ' + row.rowSpan">{{ row.timeLabel }}</div>
        @if (!row.hasEvent) {
          <div class="empty" [style.grid-row]="row.rowStart + ' / span ' + row.rowSpan" [style.min-height]="(row.rowSpan * subRowHeightPx) + 'px'"></div>
        }
      }
      @for (block of timelineEventBlocks(); track block.id) {
        <div class="event" [class.active]="block.isActive" [style.grid-row]="block.rowStart + ' / span ' + block.rowSpan">
          <div class="event-title">{{ block.schedule.title }}</div>
          <div class="event-meta">{{ block.schedule.startTime.substring(0, 5) }} - {{ block.schedule.endTime.substring(0, 5) }}</div>
        </div>
      }
    </div>
  </div>
</article>
