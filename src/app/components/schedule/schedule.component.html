<article class="card">
  <div class="card-header">
    <div>
      <h2 class="card-title">現在の予定</h2>
    </div>
  </div>
  <div class="content">
    <div class="schedule">
      @for (slot of timelineSlots(); track $index) {
        <div class="slot">
          <div class="time">{{ slot.timeLabel }}</div>
          @if (slot.schedule) {
            <div class="event" [class.active]="slot.isActive">
              <div class="event-title">{{ slot.schedule.title }}</div>
              <div class="event-meta">{{ slot.schedule.startTime.substring(0, 5) }} - {{ slot.schedule.endTime.substring(0, 5) }}</div>
            </div>
          } @else {
            <div class="empty"></div>
          }
        </div>
      }
    </div>
  </div>
</article>
